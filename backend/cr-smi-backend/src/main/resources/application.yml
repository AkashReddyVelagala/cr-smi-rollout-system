spring:
  application:
    name: cr-smi-backend
  threads:
    virtual:
      enabled: true # Enables Java 21 Virtual Threads (Project Loom) for high concurrency
  datasource:
    url: jdbc:postgresql://localhost:5432/cr_smi_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate # Enforces Flyway as the single source of truth
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    problemdetails:
      enabled: true # RFC 7807 standardized error payloads

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

  springdoc:
    swagger-ui:
      path: /swagger-ui.html